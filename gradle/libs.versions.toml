[versions]
# plugins
#kotlin = "2.3.0-Beta1"
kotlin = "2.2.20"
agp = "8.13.0"
hilt = "2.57.2"
ksp = "2.2.20-2.0.4"

# libs
core-ktx = "1.17.0"
lifecycle = "2.9.4"
activity-compose = "1.12.0-alpha09"
compose-bom = "2025.10.00"

nav3 = "1.0.0-alpha11"
nav3-material = "1.3.0-alpha01"
material3 = "1.4.0"
lifecycle-viewmodel = "1.0.0-alpha04"

kotlinx-coroutines = "1.10.2"
ktlint = "0.50.0"
timber = "5.0.1"

# test
junit = "4.13.2"
kover = "0.9.3"
kotest = "6.0.4"
test-report = "1.4"

[libraries]
# Android
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material-icons = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material3-adaptive-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite" }
androidx-material3-navigation3 = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation3", version.ref = "nav3-material" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycle-viewmodel" }
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "nav3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "nav3" }

# androidx-navigation = { module = "androidx.navigation:navigation-compose"}

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version = "0.7.1" }
auto-service = { module = "com.google.auto.service:auto-service", version="1.1.1" }

hilt = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-ksp = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }

javax-inject = { module = "javax.inject:javax.inject", version = "1" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

# test
junit = { group = "junit", name = "junit", version.ref = "junit" }

kotest = { group = "io.kotest", name = "kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }
kotest-datatest = { group = "io.kotest", name = "kotest-framework-datatest", version.ref = "kotest" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

android-app = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# https://github.com/monnage/gradle-test-report
test-report = { id = "com.monnage.test-report", version.ref = "test-report" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }

versions = { id = "com.github.ben-manes.versions", version = "0.53.0" }
