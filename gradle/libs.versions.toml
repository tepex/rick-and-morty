[versions]
# plugins
kotlin = "2.3.0-Beta1"
agp = "8.13.0"

# libs
core-ktx = "1.17.0"
lifecycle = "2.9.4"
activity-compose = "1.11.0"
compose-bom = "2025.10.00"

kotlinx-coroutines = "1.9.0"
ktlint = "0.50.0"
timber = "5.0.1"

# test
junit = "4.13.2"
kover = "0.9.0"
kotest = "5.9.1"
test-report = "1.4"

[libraries]
# Android
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material3-adaptive-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite" }

# androidx-navigation = { module = "androidx.navigation:navigation-compose"}

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version = "0.6.1" }
auto-service = { module = "com.google.auto.service:auto-service", version="1.1.1" }

javax-inject = { module = "javax.inject:javax.inject", version = "1" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

# test
junit = { group = "junit", name = "junit", version.ref = "junit" }

kotest = { group = "io.kotest", name = "kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }
kotest-datatest = { group = "io.kotest", name = "kotest-framework-datatest", version.ref = "kotest" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

android-app = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# https://github.com/monnage/gradle-test-report
test-report = { id = "com.monnage.test-report", version.ref = "test-report" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }

versions = { id = "com.github.ben-manes.versions", version = "0.53.0" }
